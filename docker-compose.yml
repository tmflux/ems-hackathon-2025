version: "3.8"
services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: ems_mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data

  influxdb:
    image: influxdb:1.8
    container_name: ems_influxdb
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=ems
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=admin123
    volumes:
      - influxdb_data:/var/lib/influxdb

  grafana:
    image: grafana/grafana:9.5.2
    container_name: ems_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - influxdb

  backend:
    build: ./backend
    container_name: ems_backend
    ports:
      - "8000:8000"
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - INFLUXDB_HOST=influxdb
      - INFLUXDB_PORT=8086
      - INFLUXDB_DB=ems
      - INFLUXDB_USER=admin
      - INFLUXDB_PASSWORD=admin123
    depends_on:
      - mosquitto
      - influxdb

  simulator:
    build: ./simulator
    container_name: ems_simulator
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
    depends_on:
      - mosquitto

volumes:
  mosquitto_data:
  influxdb_data:
